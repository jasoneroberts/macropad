# Macropad firmware: keys + knob -> USB HID and Bluetooth HID, LVGL tiles on an SPI LCD.
# Board-specific settings are in boards/<board>.conf.

# ---- Logging ----
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_USBD_HID_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# ---- USB HID (device_next stack, same helper as the trackball) ----
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_HID_SUPPORT=y
CONFIG_SAMPLE_USBD_PRODUCT="Macropad"
CONFIG_SAMPLE_USBD_MANUFACTURER="Jase"
# 0x0007 is the trackball, so the PC keeps the two apart
CONFIG_SAMPLE_USBD_PID=0x0008
# Bus-powered from the PC's point of view (the LiPo is our own business)
CONFIG_SAMPLE_USBD_SELF_POWERED=n
# A macro key can wake a sleeping PC
CONFIG_SAMPLE_USBD_REMOTE_WAKEUP=y
CONFIG_UDC_BUF_POOL_SIZE=4096

# ---- Inputs: key matrix / buttons, knob (gpio-qdec), keymap ----
CONFIG_GPIO=y
CONFIG_INPUT=y

# ---- Display + LVGL ----
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_ERR=y
CONFIG_LVGL=y
CONFIG_LV_Z_MEM_POOL_SIZE=24576
# Draw buffer = 16 % of the screen (320 x 240 x 2 bytes x 0.16 = 24.6 KB). LVGL
# renders in strips, so a full-screen buffer (150 KB) is not needed.
CONFIG_LV_Z_VDB_SIZE=16
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_COLOR_DEPTH_16=y
# The panel wants RGB565 big-endian on the wire; LVGL draws little-endian
CONFIG_LV_COLOR_16_SWAP=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_USE_LOG=y
CONFIG_LV_LOG_LEVEL_WARN=y
CONFIG_MAIN_STACK_SIZE=3072

# Backlight brightness through a PWM "LED"
CONFIG_LED=y
CONFIG_PWM=y

# ---- Bluetooth HID (NCS HIDS service), same set-up as the trackball ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Macropad"
# 961 = HID keyboard
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_SMP=y
CONFIG_BT_CONN_CTX=y
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_INPUT_REP_MAX=2
CONFIG_BT_HIDS_OUTPUT_REP_MAX=0
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x2FE3
CONFIG_BT_DIS_PNP_PID=0x0008
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20
CONFIG_BT_ATT_TX_COUNT=5
# Same laptop-collision workaround as the NCS keyboard sample
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n

# ---- Bonds survive a reset (settings in the storage partition) ----
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
