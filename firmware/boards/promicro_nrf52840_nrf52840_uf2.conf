# Powers the LCD: P0.13 switches the VCC pin's regulator (vcc_ext in the overlay)
CONFIG_REGULATOR=y

# Logs on a USB serial port next to the HID keyboard (the board's board_cdc_acm_uart).
# sample_usbd registers it and makes the device composite. Open the COM port at any baud.
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG_BACKEND_UART=y

# Battery voltage through the SAADC (VDDH / 5)
CONFIG_ADC=y

# sys_reboot() for the "restart into the UF2 bootloader" key combo (HID_Engine.c)
CONFIG_REBOOT=y

# 32 kHz clock from the chip's own RC oscillator instead of the board's crystal.
# Some SuperMini batches have a faulty 32.768 kHz crystal, which shows up as
# Bluetooth that never connects or drops out. The RC oscillator is recalibrated
# every few seconds and is accurate enough for Bluetooth (500 ppm), at the cost
# of a few uA. To try the crystal, delete this line.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
